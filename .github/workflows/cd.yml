name: CD

# Manual deployment only (per CI/CD design §7 Q2: auto-merge PRs, manual trigger CD).
# The deploy job is pinned to the dedicated us-test runner. Do not widen runs-on
# back to a bare `self-hosted` label: that also matches the GeoMix runner `us_test`.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref (branch, tag, or SHA) to build and deploy (ignored when rollback_tag is set)'
        required: false
        default: 'main'
        type: string
      rollback_tag:
        description: 'Existing GHCR image tag to roll back to (e.g. sha-a1b2c3d); skips build when set'
        required: false
        default: ''
        type: string

concurrency:
  group: cd-main
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: build-and-push
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      ghcr_owner: ${{ steps.meta.outputs.owner }}
      image_tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Checkout repository
        if: ${{ inputs.rollback_tag == '' }}
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || 'main' }}

      - name: Resolve GHCR owner and target image tag
        id: meta
        env:
          ROLLBACK_TAG: ${{ inputs.rollback_tag }}
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          OWNER="$(printf '%s' "$REPO_OWNER" | tr '[:upper:]' '[:lower:]')"
          echo "owner=${OWNER}" >> "$GITHUB_OUTPUT"

          if [ -n "$ROLLBACK_TAG" ]; then
            if ! printf '%s' "$ROLLBACK_TAG" | grep -Eq '^[A-Za-z0-9_.-]+$'; then
              echo "Invalid rollback_tag format: $ROLLBACK_TAG"
              exit 1
            fi
            echo "Rollback requested; skipping Docker build and using tag: $ROLLBACK_TAG"
            echo "tag=${ROLLBACK_TAG}" >> "$GITHUB_OUTPUT"
          else
            SHORT_SHA="$(git rev-parse --short=7 HEAD)"
            echo "Building image for commit sha-${SHORT_SHA}"
            echo "tag=sha-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Docker Buildx
        if: ${{ inputs.rollback_tag == '' }}
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: ${{ inputs.rollback_tag == '' }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image to GHCR
        if: ${{ inputs.rollback_tag == '' }}
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner }}/sonargate:${{ steps.meta.outputs.tag }}
            ghcr.io/${{ steps.meta.outputs.owner }}/sonargate:latest
          cache-from: type=gha,scope=sonargate
          cache-to: type=gha,mode=max,scope=sonargate,ignore-error=true

  deploy:
    name: deploy
    needs: build-and-push
    # All four labels are required. actions/runner 2.338.2 assigns the system
    # labels self-hosted, Linux, and X64. sonargate-us-test is the extra user
    # label on the runner at /opt/sonargate-runner. GeoMix us_test
    # (/opt/actions-runner) does not have that label and must not run this job.
    runs-on: [self-hosted, Linux, X64, sonargate-us-test]
    timeout-minutes: 15
    steps:
      - name: Checkout deployment manifests
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || 'main' }}

      - name: Deploy SonarGate only on 127.0.0.1:18082
        env:
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/sonargate' }}
          PUBLIC_COLLECT_URL: ${{ vars.PUBLIC_COLLECT_URL || '' }}
          REQUIRE_READY_ON_DEPLOY: ${{ vars.REQUIRE_READY_ON_DEPLOY || 'false' }}
          GHCR_OWNER: ${{ needs.build-and-push.outputs.ghcr_owner }}
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GHCR_READ_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # Fixed host publish. Do not read SONARGATE_PORT: an unset value used to
          # fall through to 8080, and a variable must not publish 0.0.0.0.
          HOST_PORT=18082
          TARGET_IMAGE="ghcr.io/${GHCR_OWNER}/sonargate:${IMAGE_TAG}"
          echo "Deploying ${TARGET_IMAGE} into ${DEPLOY_PATH} (127.0.0.1:${HOST_PORT} only)"

          case "${DEPLOY_PATH}" in
            /|/opt/actions-runner|/opt/actions-runner/*|/etc|/etc/*|/usr|/usr/*|/var/lib/docker|/var/lib/docker/*)
              echo "ERROR: refusing to deploy into ${DEPLOY_PATH}"
              exit 1
              ;;
          esac
          case "${DEPLOY_PATH}" in
            /*) ;;
            *)
              echo "ERROR: DEPLOY_PATH must be absolute: ${DEPLOY_PATH}"
              exit 1
              ;;
          esac
          if [[ "${DEPLOY_PATH}" == *..* ]]; then
            echo "ERROR: DEPLOY_PATH must not contain .."
            exit 1
          fi

          # Sync the SonarGate compose file only. Never copy, edit, reload, or restart nginx.
          mkdir -p "${DEPLOY_PATH}"
          cp docker-compose.prod.yml "${DEPLOY_PATH}/docker-compose.prod.yml"
          COMPOSE_FILE="${DEPLOY_PATH}/docker-compose.prod.yml"

          EXPECTED_PORT_LINE="      - '127.0.0.1:${HOST_PORT}:8080'"
          ACTUAL_PORT_LINE="$(grep -E "^[[:space:]]*-[[:space:]]*['\"].*:8080['\"][[:space:]]*$" "${COMPOSE_FILE}" || true)"
          if [ "${ACTUAL_PORT_LINE}" != "${EXPECTED_PORT_LINE}" ]; then
            echo "ERROR: ${COMPOSE_FILE} must publish exactly ${EXPECTED_PORT_LINE}"
            echo "Found: ${ACTUAL_PORT_LINE:-<none>}"
            exit 1
          fi

          # Server-managed env must already exist. This job does not write secrets.
          if [ ! -f "${DEPLOY_PATH}/.env" ]; then
            echo "ERROR: ${DEPLOY_PATH}/.env not found. Create it with chmod 600 before deploying."
            exit 1
          fi

          cd "${DEPLOY_PATH}"

          # Record the running image so a failed gate can roll SonarGate back.
          # Do not delete that image, its volumes, or any other project's containers.
          PREV_IMAGE="$(docker inspect --format='{{.Config.Image}}' sonargate 2>/dev/null || true)"
          echo "Previous image (kept for rollback): ${PREV_IMAGE:-<none>}"

          printf '%s' "${GHCR_TOKEN}" | docker login ghcr.io -u "${GHCR_USERNAME}" --password-stdin
          export GHCR_OWNER IMAGE_TAG
          # A runner-level SONARGATE_PORT must not be visible to compose interpolation.
          unset SONARGATE_PORT || true

          # Replace only the sonargate service. Do not down the project or remove orphans.
          docker compose -f docker-compose.prod.yml pull sonargate
          docker compose -f docker-compose.prod.yml up -d --no-deps sonargate

          GATE_OK=1

          PORT_MAP="$(docker port sonargate 8080/tcp 2>/dev/null || true)"
          echo "sonargate 8080/tcp is published as: ${PORT_MAP:-<none>}"
          if [ "${PORT_MAP}" != "127.0.0.1:${HOST_PORT}" ]; then
            echo "GATE FAILED: expected exactly 127.0.0.1:${HOST_PORT}, refusing any other publish"
            GATE_OK=0
          fi

          if [ "$GATE_OK" = "1" ]; then
            echo "Checking local liveness: http://127.0.0.1:${HOST_PORT}/health ..."
            HEALTH_OK=0
            for _ in $(seq 1 30); do
              STATUS="$(curl -sS -o /dev/null -w '%{http_code}' "http://127.0.0.1:${HOST_PORT}/health" || echo 000)"
              if [ "$STATUS" = "200" ]; then
                HEALTH_OK=1
                break
              fi
              sleep 1
            done
            if [ "$HEALTH_OK" != "1" ]; then
              echo "GATE FAILED: GET /health did not return 200 within 30s"
              GATE_OK=0
            else
              echo "GET /health -> 200 OK"
            fi
          fi

          if [ "$GATE_OK" = "1" ]; then
            echo "Checking local readiness: http://127.0.0.1:${HOST_PORT}/ready ..."
            READY_BODY="$(mktemp)"
            READY_STATUS="$(curl -sS -o "$READY_BODY" -w '%{http_code}' "http://127.0.0.1:${HOST_PORT}/ready" || echo 000)"
            echo "GET /ready -> HTTP ${READY_STATUS}: $(cat "$READY_BODY")"
            rm -f "$READY_BODY"
            if [ "$REQUIRE_READY_ON_DEPLOY" = "true" ] && [ "$READY_STATUS" != "200" ]; then
              echo "GATE FAILED: REQUIRE_READY_ON_DEPLOY=true but /ready returned ${READY_STATUS}"
              GATE_OK=0
            fi
          fi

          if [ "$GATE_OK" = "1" ] && [ -n "$PUBLIC_COLLECT_URL" ]; then
            echo "Checking public endpoint (no redirect allowed): ${PUBLIC_COLLECT_URL} ..."
            PUB_STATUS="$(curl -sS --max-time 10 -o /dev/null -w '%{http_code}' -X POST "$PUBLIC_COLLECT_URL" || echo 000)"
            echo "POST ${PUBLIC_COLLECT_URL} (no auth, no redirects) -> HTTP ${PUB_STATUS}"
            case "$PUB_STATUS" in
              301|302|307|308)
                echo "GATE FAILED: Public endpoint returned redirect HTTP ${PUB_STATUS}; GeoMix will fail with redirect_refused!"
                GATE_OK=0
                ;;
              401)
                echo "Public endpoint verified: direct HTTPS with auth active (HTTP 401, no redirects)."
                ;;
              *)
                echo "GATE FAILED: Expected HTTP 401 from unauthenticated public /v1/collect, got ${PUB_STATUS}"
                GATE_OK=0
                ;;
            esac
          fi

          # Roll back only the sonargate service. Do not down the stack or prune images.
          if [ "$GATE_OK" != "1" ]; then
            echo "=== Recent sonargate container logs ==="
            docker logs --tail 100 sonargate || true
            if [ -n "$PREV_IMAGE" ] && [ "$PREV_IMAGE" != "$TARGET_IMAGE" ]; then
              PREV_TAG="${PREV_IMAGE##*:}"
              echo "Rolling back sonargate only to ${PREV_IMAGE} (tag=${PREV_TAG})..."
              IMAGE_TAG="$PREV_TAG" docker compose -f docker-compose.prod.yml up -d --no-deps sonargate || true
            else
              echo "No distinct previous image available for rollback. Other containers, volumes, and images were not modified."
            fi
            exit 1
          fi

          # No docker image/system/volume/container prune. A host-wide prune deletes
          # other projects' unused images and SonarGate tags still needed for rollback.
          echo "Deployment succeeded: ${TARGET_IMAGE}"
