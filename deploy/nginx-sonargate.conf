server {
    listen 443 ssl http2;
    server_name sonargate.yourdomain.com;

    ssl_certificate     /etc/letsencrypt/live/sonargate.yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sonargate.yourdomain.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    client_max_body_size 128k;

    location = /v1/collect {
        proxy_pass http://127.0.0.1:8080/v1/collect;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Must disable redirects so GeoMix SSRF guard never rejects 3xx responses
        proxy_redirect off;

        # Slightly greater than GeoMix VISIBILITY_TIMEOUT_MS (120s)
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 130s;
    }

    location ~ ^/(health|ready|v1/engines)$ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_redirect off;
    }
}
