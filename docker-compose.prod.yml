services:
  sonargate:
    image: ghcr.io/${GHCR_OWNER:?GHCR_OWNER is required}/sonargate:${IMAGE_TAG:-latest}
    container_name: sonargate
    env_file:
      - .env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 8080
    ports:
      # Host publish is fixed. Do not interpolate SONARGATE_PORT: unset used to
      # fall through to 8080, and a shell or .env value must not move this port
      # or publish it on 0.0.0.0. Container process still listens on 8080.
      - '127.0.0.1:18082:8080'
    stop_grace_period: 40s
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=64m
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 512m
    logging:
      driver: json-file
      options:
        max-size: '20m'
        max-file: '5'
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:8080/health']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
